[tool.vommit]
version_source = "Cargo.toml"

allow_breaking_bang = true
allow_breaking_footer = true
prerelease_token = "rc"
confirm = true
ignore = []

[tool.vommit.git]
enabled = true
origin = "origin"
branch = "master"
on_wrong_branch = "error"
tag_format = "v{version}"
commit_format = "{version}"

[tool.vommit.changelog]
enabled = true
file = "CHANGELOG.md"
include_prereleases = false
placeholder = "<!-- next-version-placeholder -->"
placeholder_regex = "^<!\\-\\-[ \\t]+next\\-version\\-placeholder[ \\t]+\\-\\->$"
entry_title_format = "## v{version} ({date:%Y-%m-%d})"

[tool.vommit.changelog.levels]
break = "Breaking Change{s}"
feat = "Feature{s}"
fix = "Fix{es}"
perf = "Performance"
docs = "Documentation"

[tool.vommit.pypi]
enabled = false

[tool.vommit.commands]
clean = ""
build = ""
publish = ""
post_publish = ""

[tool.vommit.version_bump_map]
break = "major"
feat = "minor"
fix = "patch"
perf = "patch"
