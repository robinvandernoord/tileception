<!doctype html>
<!-- The promo video's artwork, in the website's style. art.html?<piece>
     renders one piece: wallpaper-laptop, wallpaper-desktop, intro, outro,
     handoff (the frame around two screens), chip&<text> (a small label at the
     top right), or caption&<title>&<line>&<colour>. -->
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Big Shoulders Display"; font-weight: 900; src: url("../../../website/public/assets/fonts/big-shoulders-display-900.woff2") format("woff2"); }
@font-face { font-family: "Familjen Grotesk"; font-weight: 400 700; src: url("../../../website/public/assets/fonts/familjen-grotesk.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../../../website/public/assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); }
:root { --red: #d42a1e; --yellow: #f4c22f; --blue: #1d4fa2; --ink: #121212; --canvas: #f4f3ee; --rule: 24px; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
.piece { display: none; position: absolute; inset: 0; }
.display { font: 900 1em/.84 "Big Shoulders Display", sans-serif; text-transform: uppercase; }
.sq { display: inline-flex; align-items: center; gap: .14em; }
.sq::after { content: ""; width: .3em; height: .3em; background: var(--c); flex: none; }

/* Wallpapers: the desktop's graphite, with a quiet block composition. */
.wall { background: #1a1d22; }
.wall .blocks { position: absolute; right: 0; bottom: 0; width: 980px; height: 620px; display: grid; gap: 18px;
  grid-template: 1fr 1fr 1.3fr / 1.2fr 1fr .7fr; opacity: .2; padding: 18px; }
.wall .blocks i { display: block; background: #2a2e36; }
.wall .blocks .r { background: var(--red); } .wall .blocks .y { background: var(--yellow); } .wall .blocks .b { background: var(--blue); }
.wall .blocks .tall { grid-row: span 2; } .wall .blocks .wide { grid-column: span 2; }
.wall.flip .blocks { right: auto; left: 0; transform: scaleX(-1); }

/* Intro: the logo composition, filling the screen. */
.card { background: var(--ink); gap: var(--rule); padding: var(--rule); }
.card > div { background: var(--canvas); }
#intro { grid-template: "red head nest" 1fr "wht lede yel" 260px / 70px 1110px 1fr; }
#intro .red { grid-area: red; background: var(--red); } #intro .wht { grid-area: wht; }
#intro .head { grid-area: head; display: flex; align-items: flex-end; padding: 50px 60px; font-size: 212px; }
#intro .head h1 { font-size: 1em; display: flex; flex-direction: column; gap: 6px; }
#intro .lede { grid-area: lede; padding: 36px 60px; display: flex; flex-direction: column; justify-content: center; font: 400 42px/1.25 "Familjen Grotesk", sans-serif; }
#intro .lede b { font: 900 64px/1 "Big Shoulders Display", sans-serif; text-transform: uppercase; margin-bottom: 12px; }
#intro .yel { grid-area: yel; background: var(--yellow); display: flex; align-items: flex-end; padding: 34px 40px; font: 700 42px/1 "Familjen Grotesk", sans-serif; }
#intro .nest { grid-area: nest; background: var(--ink); display: grid; gap: 18px; grid-template: 1fr 1fr / 1fr 1.3fr; }
#intro .nest i { background: var(--canvas); display: block; }
#intro .nest .b { background: var(--blue); grid-row: span 2; }
#intro .nest .s { display: grid; gap: 14px; grid-template: 1fr 1fr / 1fr 1fr; background: var(--ink); }
#intro .nest .s .r { background: var(--red); } #intro .nest .s .y { background: var(--yellow); grid-column: span 2; }

/* Outro: get it. */
#outro { grid-template: "head head blue" 1fr "cmd cmd red" 230px "url yel red" 150px / 1fr 420px 260px; }
#outro .head { grid-area: head; display: flex; align-items: flex-end; padding: 50px 60px; font-size: 300px; }
#outro .cmd { grid-area: cmd; background: var(--ink); color: var(--canvas); display: flex; align-items: center; padding: 0 60px;
  font: 500 44px/1.2 "IBM Plex Mono", monospace; outline: var(--rule) solid var(--ink); }
#outro .cmd span { color: var(--yellow); margin-right: .6em; }
#outro .url { grid-area: url; display: flex; align-items: center; padding: 0 60px; font: 700 64px/1 "Familjen Grotesk", sans-serif; }
#outro .yel { grid-area: yel; background: var(--yellow); display: flex; align-items: center; padding: 0 40px; font: 700 34px/1.1 "Familjen Grotesk", sans-serif; }
#outro .blue { grid-area: blue; background: var(--blue); }
#outro .red { grid-area: red; background: var(--red); }

/* Handoff: two computers side by side; the screens are placed over the holes. */
#handoff { background: var(--canvas); }
#handoff .screen { position: absolute; top: 230px; width: 800px; height: 450px; background: var(--ink);
  outline: var(--rule) solid var(--ink); }
#handoff .laptop { left: 100px; } #handoff .desktop { left: 1020px; }
#handoff .label { position: absolute; top: 120px; font-size: 76px; }
#handoff .laptop-label { left: 76px; } #handoff .desktop-label { left: 996px; }
#handoff .base { position: absolute; top: 704px; height: 26px; background: var(--ink); }
#handoff .base.l { left: 50px; width: 900px; }
#handoff .stand { position: absolute; top: 704px; left: 1370px; width: 100px; height: 120px; background: var(--ink); }
#handoff .foot { position: absolute; top: 824px; left: 1290px; width: 260px; height: 24px; background: var(--ink); }
#handoff .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; display: grid;
  grid-template-columns: 1fr 1fr 1fr; gap: var(--rule); background: var(--ink); padding-top: var(--rule); }
#handoff .strip i { display: block; } #handoff .strip .r { background: var(--red); } #handoff .strip .y { background: var(--yellow); } #handoff .strip .b { background: var(--blue); }

/* Captions: a black block at the bottom left, with a coloured square. */
#caption { display: none; }
#caption .box { position: absolute; left: 60px; bottom: 60px; max-width: 1500px; background: var(--ink); color: var(--canvas);
  padding: 26px 40px 22px; font-size: 76px; border-left: 24px solid var(--c); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
#chip .box { position: absolute; right: 60px; top: 70px; background: var(--yellow); color: var(--ink); padding: 18px 28px 14px; font-size: 54px;
  outline: 8px solid var(--ink); }
#caption .box small { display: block; font: 500 34px/1.3 "Familjen Grotesk", sans-serif; text-transform: none; margin-top: 12px; color: #c9c7bf; }
</style></head><body>

<div class="piece wall" id="wallpaper-laptop"><div class="blocks">
  <i class="tall"></i><i class="r"></i><i></i><i class="wide y"></i><i class="b"></i><i class="wide"></i><i></i>
</div></div>
<div class="piece wall flip" id="wallpaper-desktop"><div class="blocks">
  <i class="b tall"></i><i></i><i class="y"></i><i class="wide"></i><i class="r"></i><i class="wide"></i><i></i>
</div></div>

<div class="piece card" id="intro">
  <div class="red"></div>
  <div class="head"><h1 class="display"><span class="sq" style="--c:var(--red)">Tile it.</span><span class="sq" style="--c:var(--yellow)">Nest it.</span><span class="sq" style="--c:var(--blue)">Zoom it.</span></h1></div>
  <div class="nest"><i class="b"></i><i></i><div class="s"><i class="r"></i><i></i><i class="y"></i></div></div>
  <div class="wht"></div>
  <div class="lede"><b>Tileception</b>A nested tiling desktop for Linux</div>
  <div class="yel">tileception.space</div>
</div>

<div class="piece card" id="outro">
  <div class="head"><h2 class="display" style="font-size:1em"><span class="sq" style="--c:var(--red)">Get it.</span></h2></div>
  <div class="blue"></div>
  <div class="cmd"><span>$</span>curl -fsSL https://tileception.space/install | sh</div>
  <div class="red"></div>
  <div class="url">tileception.space</div>
  <div class="yel">Free software, MIT licence</div>
</div>

<div class="piece" id="handoff">
  <div class="label laptop-label display"><span class="sq" style="--c:var(--red)">Laptop</span></div>
  <div class="label desktop-label display"><span class="sq" style="--c:var(--blue)">Desktop</span></div>
  <div class="screen laptop"></div><div class="base l"></div>
  <div class="screen desktop"></div><div class="stand"></div><div class="foot"></div>
  <div class="strip"><i class="r"></i><i class="y"></i><i class="b"></i></div>
</div>

<div class="piece" id="chip"><div class="box display"><span class="title"></span></div></div>

<div class="piece" id="caption"><div class="box display"><span class="title"></span><small></small></div></div>

<script>
const [piece, ...rest] = decodeURIComponent(location.search.slice(1)).split('&');
const shown = document.getElementById(piece);
shown.style.display = piece.startsWith('wallpaper') || piece === 'handoff' ? 'block' : piece === 'caption' ? 'block' : 'grid';
if (piece === 'chip') shown.querySelector('.title').textContent = rest[0];
if (piece === 'caption') {
  const [title, sub, colour] = rest;
  shown.querySelector('.title').textContent = title;
  shown.querySelector('small').textContent = sub || '';
  shown.querySelector('.box').style.setProperty('--c', `var(--${colour || 'red'})`);
}
</script>
</body></html>
