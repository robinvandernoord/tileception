[package]
name = "tileception-auth"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Single-flight Linux-PAM password authentication for Tileception"

[workspace]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[dependencies]
libc = "0.2"
secrecy = "0.10"
zeroize = "1"

[dev-dependencies]
rpassword = "7"
tempfile = "3"
