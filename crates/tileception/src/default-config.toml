# Tileception configuration. Changes apply as soon as the file is saved.
#
# This file was written with the defaults on first run. Delete it to get the
# defaults back.

[general]
# Command for the `terminal` action. Unset: the first of ghostty, foot,
# alacritty, kitty, lxterminal, gnome-terminal that is installed.
# terminal = "ghostty"

# Pixels between windows and around the screen edge.
gap = 12

# Length of a zoom or move, in milliseconds.
animation_ms = 280

# Hold this and drag a window with the left button to move it, or with the
# right button to resize it: Alt, Super, Ctrl or Shift.
drag_modifier = "Alt"

# When a window closes, spread its space over the whole row (so closing
# exactly undoes opening). Otherwise its next neighbour takes all of it.
share_removed_space = true

# Height of the strip of tabs above a tile with several windows.
tab_height = 28

# Shell command lines run once when Tileception starts.
# Notifications are built in; no notification daemon is needed.
autostart = []

# Command for the `lock` action. {wallpaper} becomes the wallpaper's path.
# Unset: the built-in password lock screen with your wallpaper.
# lock_command = "swaylock -f -i {wallpaper}"
# Experimental app-matched layout persistence is disabled unless opted into.
# restore_layout = false
# Suspend is enabled by default. Set false to disable the power-menu action.
# suspend_enabled = true
# [binds] below adds to and overrides the built-in bindings, so new built-in
# shortcuts reach you after an update. Set false to make [binds] the
# complete list instead.
# default_binds = true
# On an empty desktop (after login, or after closing the last window) show the
# launcher with a clock: type to search, tap Super for a plain desktop.
# welcome = true

[theme]
# Tide: flat graphite with a teal to blue accent. Colours are #rrggbb or
# #rrggbbaa.
# background = "#1c1f24"
# surface = "#24272e"
# surface_raised = "#2e323a"
# border = "#343842"
# text = "#e8eaee"
# muted = "#8b919c"
# accent = "#2bd4a7"
# accent_end = "#5c8ff2"
# on_accent = "#0d1117"
# Wrong passwords and critical notifications.
# danger = "#f0646a"
# Cautions, such as volume boosted past 100%.
# warning = "#f2b04c"
# radius = 6
# popup_radius = 10
# How far the focus glow reaches, in pixels; 0 turns it off.
# glow = 18
# font = "Noto Sans"
# font_size = 13
# A background image (PNG, JPEG or WebP), also shown on the lock screen.
# wallpaper = "~/Pictures/wallpaper.jpg"
# How it fits the screen: fill, fit, stretch or center.
# wallpaper_fit = "fill"
# What applications are told through the desktop portal: dark, light, or
# default (each application's own choice).
# colour_scheme = "dark"

[idle]
# Seconds of inactivity; 0 disables the corresponding action.
# Visible video players can inhibit both through the Wayland idle-inhibit protocol.
lock_after = 0
off_after = 600

[media]
# Percent per volume or brightness key press. Held keys repeat.
volume_step = 5
brightness_step = 5
# How far volume may be boosted past 100% (up to 200). Boosted volume shows
# in the warning colour; loud boosts can distort.
max_volume = 150
# A small card at the bottom of the screen when a level or playback changes.
osd = true
osd_timeout_ms = 1500

[shell]
# Each part of the desktop is Tileception's own ("builtin"), switched off
# ("none"), or a command that runs in its place. Changes apply on save.
#
# The launcher (tap Super, `launcher`), e.g. "fuzzel". Not builtin: no
# welcome screen either.
launcher = "builtin"
# Notification popups and history. Anything but "builtin" stops the built-in
# service so another daemon can take over: start it under [general]
# autostart (autostart = ["swaync"]). A command is what Super+N runs, e.g.
# "swaync-client -t"; with "none", Super+N shows only the sound controls.
notifications = "builtin"
# The power menu (Super+X), e.g. "wlogout".
power_menu = "builtin"
# The lock screen (Super+L, and locking when idle), e.g.
# "swaylock -f -i {wallpaper}". {wallpaper} becomes the wallpaper's path.
lock = "builtin"
# Volume, media keys and brightness: "builtin" or "none". To use your own
# commands instead, bind the keys to them in [binds].
media = "builtin"

# Window rules decide how matching windows open. app_id is the Wayland app id
# or X11 class; patterns ignore case, with * for anything and ? for one
# character. Every matching rule applies, in order, later ones winning.
# float = true floats, false tiles (whatever the window asks for); size is
# [width, height] for a floating window; fullscreen and minimized open it so.
#
# [[rules]]
# app_id = "pavucontrol"
# float = true
# size = [720, 480]
#
# [[rules]]
# title = "Picture-in-Picture"
# float = true

[keyboard]
# Defaults come from XKB_DEFAULT_* in the environment.
# layout = "us"
# variant = "altgr-intl"
# options = "compose:ralt"
repeat_delay = 400
repeat_rate = 30

# Key bindings: "Modifiers+Key" = "command", or a list of commands run in
# order: "Super+Escape" = ["reload", "spawn notify-send 'Reloaded'"].
# These come on top of the built-in bindings (unless default_binds = false):
# a key listed here replaces its built-in command, "none" unbinds it
# ("Super+H" = "none"), and keys not listed keep their built-in command.
#
# Modifiers: Super, Alt, Ctrl, Shift. Keys are xkb keysym names (T, Return,
# Left, bracketleft, Page_Up, F1, XF86AudioRaiseVolume, ...), or WheelUp,
# WheelDown, WheelLeft, WheelRight for the mouse wheel. A modifier on its
# own ("Super") fires when it is pressed and let go with nothing else.
#
# Commands (the same as `tileception msg <command>`):
#   terminal              open the terminal beside the focused window
#   spawn <command line>  run a shell command
#   close                 close the focused window
#   overview              show everything (Esc or a click leaves)
#   step-in [pointer]     zoom one level in, toward the focus or the pointer
#   step-out              zoom one level out
#   focus <dir>           frame the neighbouring space: left, right, up, down
#   move <dir>            move the focused window past its neighbour
#   resize <dir> <px>     move the divider next to the focused window that way
#   toggle-split          stack the focused row, or lay the column side by side
#   cycle [next|prev]     focus the next or previous window
#   maximize              frame the focused window on its own (again: back)
#   minimize              take the focused or selected windows out of the layout
#   restore [window-id]   put the last minimized window (or this one) back
#   back, forward         through the spaces you have framed
#   save <n>, go <n>      save the current view in slot 1-9, or go to it
#   next-tab, prev-tab    in the focused tile
#   float                 float the focused window above the layout, or dock it
#   fullscreen            cover the whole screen with the focused window
#   lock                  lock the screen (see lock_command)
#   power-menu            lock, log out, suspend, restart or power off
#   doctor [ask <text>]   the panel for asking about your setup
#   doctor use <agent>    pick its agent by ACP Registry id (e.g. claude-acp)
#   doctor mode <mode>    what it may do unasked: ask, config (Tileception's
#                         own files and commands) or yolo; backups either way
#   volume up|down [n]    change the output volume by n percent (or the step)
#   volume set <n>        set it; volume mute [on|off|toggle]
#   mic mute [on|off]     the microphone; mic up/down/set work too
#   brightness up|down    the screen's backlight; brightness set <n>
#   media <what>          the last-played player: play-pause, play, pause,
#                         next, previous, stop; plain "media" prints status
#   desktop               show or hide the Desktop tile
#   colour-scheme <s>     tell apps to use dark, light or default styles,
#                         until this file is next loaded
#   reload                reload this file
#   quit                  leave Tileception
#
# Always available: Ctrl+Alt+F1..F12 switch VT, Ctrl+Alt+BackSpace quits.
# In a nested window, Alt stands in for Super.
[binds]
"Super" = "launcher"
"Super+T" = "terminal"
"Super+B" = "spawn gtk-launch \"$(xdg-settings get default-web-browser)\""
"Super+E" = "spawn xdg-open \"$HOME\""
"Super+C" = "close"
"Super+L" = "lock"
"Super+X" = "power-menu"
"Super+N" = "notifications"
"Super+slash" = "doctor"
"Super+G" = "group"
"Super+Shift+E" = "quit"
"Super+Escape" = ["reload", "spawn notify-send 'Tileception' 'Configuration reloaded'"]

"Super+O" = "overview"
"Super+equal" = "step-in"
"Super+minus" = "step-out"
"Super+KP_Add" = "step-in"
"Super+KP_Subtract" = "step-out"
"Super+I" = "step-in"
"Super+U" = "step-out"
"Super+WheelUp" = "step-in pointer"
"Super+WheelDown" = "step-out"
"Super+M" = "maximize"
"Super+H" = "minimize"
"Super+Shift+H" = "restore"
"Super+bracketleft" = "back"
"Super+bracketright" = "forward"

"Super+Left" = "focus left"
"Super+Right" = "focus right"
"Super+Up" = "focus up"
"Super+Down" = "focus down"

"Super+Shift+Left" = "move left"
"Super+Shift+Right" = "move right"
"Super+Shift+Up" = "move up"
"Super+Shift+Down" = "move down"

"Super+Alt+Left" = "resize left 40"
"Super+Alt+Right" = "resize right 40"
"Super+Alt+Up" = "resize up 40"
"Super+Alt+Down" = "resize down 40"
"Super+J" = "toggle-split"

"Alt+Tab" = "cycle next"
"Alt+Shift+Tab" = "cycle prev"
"Super+Tab" = "next-tab"
"Super+Shift+Tab" = "prev-tab"

"Super+F" = "fullscreen"
"Super+V" = "float"
"Super+Shift+F" = "float"
"Super+D" = "desktop"

# Screenshots (grim and slurp). Print saves and copies the whole screen;
# Shift+Print lets you drag a region and asks whether to copy or save it.
"XF86AudioRaiseVolume" = "volume up"
"XF86AudioLowerVolume" = "volume down"
"XF86AudioMute" = "volume mute"
"XF86AudioMicMute" = "mic mute"
"XF86AudioPlay" = "media play-pause"
"XF86AudioPause" = "media pause"
"XF86AudioStop" = "media stop"
"XF86AudioNext" = "media next"
"XF86AudioPrev" = "media previous"
"XF86MonBrightnessUp" = "brightness up"
"XF86MonBrightnessDown" = "brightness down"
# The same for keyboards without media keys.
"Super+Ctrl+Up" = "volume up"
"Super+Ctrl+Down" = "volume down"
"Super+Ctrl+M" = "volume mute"
"Super+Ctrl+space" = "media play-pause"
"Super+Ctrl+Left" = "media previous"
"Super+Ctrl+Right" = "media next"
"Super+Ctrl+Page_Up" = "brightness up"
"Super+Ctrl+Page_Down" = "brightness down"
"Print" = "spawn tileception-screenshot"
"Shift+Print" = "spawn tileception-screenshot region --ask"

"Super+1" = "go 1"
"Super+2" = "go 2"
"Super+3" = "go 3"
"Super+4" = "go 4"
"Super+5" = "go 5"
"Super+6" = "go 6"
"Super+7" = "go 7"
"Super+8" = "go 8"
"Super+9" = "go 9"
"Super+Shift+1" = "save 1"
"Super+Shift+2" = "save 2"
"Super+Shift+3" = "save 3"
"Super+Shift+4" = "save 4"
"Super+Shift+5" = "save 5"
"Super+Shift+6" = "save 6"
"Super+Shift+7" = "save 7"
"Super+Shift+8" = "save 8"
"Super+Shift+9" = "save 9"
