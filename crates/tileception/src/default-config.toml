# Tileception configuration. Changes apply as soon as the file is saved.
#
# This file was written with the defaults on first run. Delete it to get the
# defaults back. Commented examples can differ from the defaults; their
# comments explain what happens when the setting is left unset.

[general]
# Command for the `terminal` action. Unset: the first of ghostty, foot,
# alacritty, kitty, lxterminal, gnome-terminal that is installed.
# terminal = "ghostty"

# Pixels between windows and around the screen edge.
gap = 12

# Length of a zoom or move, in milliseconds.
animation_ms = 280

# Smallest scale at which a resting window stays interactive. Larger windows
# fit uniformly into their tile; below this scale they become previews.
# Range: 0.1 to 1.0. Camera motion and Overview always use previews.
min_live_scale = 0.5

# Hold this and drag a window with the left button to move it, or with the
# right button to resize it: Alt, Super, Ctrl or Shift.
drag_modifier = "Alt"

# When a window closes, spread its space over the whole row (so closing
# exactly undoes opening). Otherwise its next neighbour takes all of it.
share_removed_space = true

# Legacy compatibility setting, accepted but ignored. Its stored default is
# true; floating windows always hang above the layout.
# sole_float_takes_desktop = true

# Height of the strip of tabs above a tile with several windows.
tab_height = 28

# Shell command lines run once when Tileception starts.
# Notifications are built in; no notification daemon is needed.
autostart = []

# Command for the `lock` action. {wallpaper} becomes the wallpaper's path.
# Unset: the built-in password lock screen with your wallpaper.
# lock_command = "swaylock -f -i {wallpaper}"
# Experimental app-matched layout persistence is disabled unless opted into.
# It does nothing with several screens or while a screen is split.
# restore_layout = false
# Suspend is enabled by default. Set false to disable the power-menu action.
# suspend_enabled = true
# [binds] below adds to and overrides the built-in bindings, so new built-in
# shortcuts reach you after an update. Set false to make [binds] the
# complete list instead.
# default_binds = true
# On an empty desktop (after login, or after closing the last window) show the
# launcher with a clock: type to search, tap Super for a plain desktop.
# welcome = true
# Map the whole edge proportionally when the pointer crosses to an adjacent
# screen, including between screens of different sizes. Off: use their
# positions in the desktop arrangement. Also called Full-edge pointer crossing
# in Settings. Applies when saved; no special build is needed.
# stretch_screen_edges = false

[clipboard]
# Keep the regular copy/paste clipboard after its source application closes.
# Uses the helper shipped with Tileception. Starts or stops when saved.
# Keeps only the latest copy in memory; no history or middle-click selection.
persist = false

[theme]
# Tide: flat graphite with a teal to blue accent. Colours are #rrggbb or
# #rrggbbaa.
# background = "#1c1f24"
# surface = "#24272e"
# surface_raised = "#2e323a"
# border = "#343842"
# text = "#e8eaee"
# muted = "#8b919c"
# accent = "#2bd4a7"
# accent_end = "#5c8ff2"
# on_accent = "#0d1117"
# Wrong passwords and critical notifications.
# danger = "#f0646a"
# Cautions, such as volume boosted past 100%.
# warning = "#f2b04c"
# The border of windows from another computer (handoff).
# guest = "#a78bfa"
# radius = 6
# popup_radius = 10
# How far the focus glow reaches, in pixels; 0 turns it off.
# glow = 18
# font = "Noto Sans"
# font_size = 13
# A background image (PNG, JPEG or WebP), also shown on the lock screen.
# wallpaper = "~/Pictures/wallpaper.jpg"
# How it fits the screen: fill, fit, stretch or center.
# wallpaper_fit = "fill"
# What applications are told through the desktop portal: dark, light, or
# default (each application's own choice).
# colour_scheme = "dark"
# How the main button of a panel shows the accent: halo (the surface tinted
# with the accent, inside an accent border and glow), gradient (filled from
# accent to accent_end) or flat (filled with accent alone).
# buttons = "halo"
# Frost: the bar, launcher, notifications, menus and cards turn translucent
# and blur what is behind them. Windows stay solid.
# frost = false

[idle]
# Seconds of inactivity; 0 disables the corresponding action.
# Visible video players can inhibit both through the Wayland idle-inhibit protocol;
# X11 players and browsers through org.freedesktop.ScreenSaver, wherever they are.
lock_after = 0
off_after = 600
# Lock the screen before the computer suspends or hibernates, however that
# was asked for (the power menu, closing the lid, systemctl suspend), so the
# desktop never shows on waking.
# lock_before_sleep = true

[touchpad]
# Tap to click: one finger is the left button, two the right, three the middle.
tap = true
# Scrolling moves the content with your fingers, as on a phone.
natural_scroll = false
# Ignore the touchpad for a moment after typing.
disable_while_typing = true
# Pointer speed, from -1 (slow) to 1 (fast).
speed = 0
# What pressing the pad down clicks: "areas" (the bottom right corner is the
# right button) or "clickfinger" (two fingers right, three middle). Unset:
# the touchpad's own default.
# click_method = "clickfinger"
# How far, in pixels, fingers travel before a swipe binding runs.
swipe_distance = 60
# Swipes and pinches bound to moving around (focus, step-in, step-out,
# overview, maximize, back, forward) move the view with your fingers. Let go
# before swipe_distance (or a pinch's usual amount) to cancel. false runs
# each gesture all at once when it has gone far enough.
follow_fingers = true

[greeter]
# Show your accent colours and wallpaper on the Tileception login screen
# (tileception --greeter). Off takes them back the next time this config loads.
share = true

[duck]
# How big the rubber duck is: 1 is normal, 2 twice as big (0.5 to 4).
size = 1

[media]
# Percent per volume or brightness key press. Held keys repeat.
volume_step = 5
brightness_step = 5
# How far volume may be boosted past 100% (up to 200). Boosted volume shows
# in the warning colour; loud boosts can distort.
max_volume = 150
# A small card at the bottom of the screen when a level or playback changes.
osd = true
osd_timeout_ms = 1500

[home]
# Tuya lights, plugs and air conditioners in the notification panel (Super+N),
# controlled on the local network. Run `tileception home import` once to fetch
# your devices, rooms and local keys from the Tuya IoT Platform.
enabled = false
# Where `tileception home import` saved them (this is the default).
# devices = "~/.config/tileception/home-devices.json"

[battery]
# Only on computers with a battery; desktops are left alone. The bar shows
# the charge either way (hover it for the time left).
#
# The focus border shows the charge: this colour while charging, and at or
# below each level while on battery. Colours are #rrggbb, or accent, warning
# or danger from [theme]. Plugged in and not charging keeps the accent.
# border = true
# charging = "#8fd65a"
# levels = [
#     { at = 35, colour = "#ecd75a" },
#     { at = 25, colour = "warning" },
#     { at = 15, colour = "danger" },
# ]
# Notifications at 20, 15 and 10 percent; the last stays until dismissed.
# alerts = true
# Hibernate at this percentage (once per discharge); 0 never does.
# hibernate_at = 5
# Switch power profiles (power-profiles-daemon) as the charger comes and
# goes: performance plugged in, balanced on battery, power saver at or below
# power_saver_at. Only on a change, so a profile picked by hand stays until
# the next one.
# power_profiles = true
# power_saver_at = 20

[updates]
# On systems with APT, the bar shows a count while updates wait: security
# updates first, then the rest. Click it, type "up" in the launcher or run
# `tileception msg updates open` to install them, clean up old kernels or
# start a release upgrade. Installing asks for your password, as sudo does.
# enabled = true
# One notification when new updates arrive.
# notify = true
# Hours between looks at the package lists. The lists themselves are
# refreshed by the system's own daily timer, or by "Check" in Updates.
# check_hours = 4

[bluetooth]
# Reconnect paired devices that were connected before the computer slept or
# the adapter was switched off, a few seconds after it is back. Devices
# switched off by hand beforehand are left alone. A notification says why
# when one cannot be reconnected.
# reconnect = true

[shell]
# Each part of the desktop is Tileception's own ("builtin"), switched off
# ("none"), or a command that runs in its place. Changes apply on save.
#
# The launcher (tap Super, `launcher`), e.g. "fuzzel". Not builtin: no
# welcome screen either.
launcher = "builtin"
# Notification popups and history. Anything but "builtin" stops the built-in
# service so another daemon can take over: start it under [general]
# autostart (autostart = ["swaync"]). A command is what Super+N runs, e.g.
# "swaync-client -t"; with "none", Super+N shows only the sound controls.
notifications = "builtin"
# The power menu (Super+X), e.g. "wlogout".
power_menu = "builtin"
# The lock screen (Super+L, and locking when idle), e.g.
# "swaylock -f -i {wallpaper}". {wallpaper} becomes the wallpaper's path.
lock = "builtin"
# Volume, media keys and brightness: "builtin" or "none". To use your own
# commands instead, bind the keys to them in [binds].
media = "builtin"
# Doctor, the panel for asking an agent about your setup (Super+/):
# "builtin" or "none".
doctor = "builtin"
# The bar: where the camera is, saved views, the clock (click
# it for a calendar) and notifications. "none" leaves the edge to the
# windows; a command such as "waybar" runs in its place and is stopped again
# when this changes.
bar = "builtin"
# The built-in bar's edge: top or bottom. The minimized-window strip stays at
# the bottom, above a bottom bar. External bars choose their own position.
bar_position = "top"
# A small outline of the whole tree in the built-in bar, with the part on
# screen marked. Click it to open a larger map: click a window there to fly
# to it, drag to pan at the current zoom level. Also the `minimap` command.
bar_minimap = true
# A chip in the bar with the Wi-Fi network or wired connection in use, when
# NetworkManager runs. Click it to switch Wi-Fi, join a network (secured ones
# ask for their password) or disconnect. Also the `network` command.
bar_network = true
# Maximum tray slots, including the overflow button. With more than this
# many applications, the last slot becomes (…) and opens the remaining items.
# Must be at least 1; changes apply on save.
tray_max_icons = 3

# Window rules decide how matching windows open. app_id is the Wayland app id
# or X11 class; patterns ignore case, with * for anything and ? for one
# character. Every matching rule applies, in order, later ones winning.
# float = true floats, false tiles (whatever the window asks for); size is
# [width, height] for a floating window; fullscreen and minimized open it so.
#
# [[rules]]
# app_id = "pavucontrol"
# float = true
# size = [720, 480]
#
# [[rules]]
# title = "Picture-in-Picture"
# float = true
# fullscreen = false
# minimized = false
# Every rule field is unset by default, but app_id or title is required.
# Unset float/size leave earlier matching rules' values or the window's
# request unchanged. Unset fullscreen/minimized leave earlier matching rules
# unchanged, otherwise windows open neither fullscreen nor minimized.

# Screens, by connector name as the log names them ("lit eDP-1 at ..."), or
# "*" for any screen. scale is how many pixels make up one point: "auto"
# (the default) picks one from the screen's size and resolution, so dense
# laptop panels and 4K monitors get 1.5 or 2; a number such as 1, 1.25, 1.5
# or 2 fixes it. 1 is how Tileception looked before scaling existed.
#
# [outputs."eDP-1"]
# scale = 1.5
# enabled = true                # keep at least one connected screen enabled
# transform = "normal"          # 90, 180, 270, flipped, flipped-90/180/270
# mode = "preferred"            # or an advertised mode such as 1920x1080@59.94
# position = [0, 0]             # top-left corner in logical pixels
#
# [outputs."DP-1"]
# scale = 1
# position = [1280, 0]          # right of a 1920-wide panel at scale 1.5
# Without positions, screens form a row in connector-name order.
#
# A wide screen can be split into side-by-side areas, each with its own
# windows, camera and Overview, as if they were screens of their own
# (DP-2.1, DP-2.2 from the left in `tileception msg outputs`). Clicking into
# an area makes it the active one, as focus follows clicks. A saved view
# holds every area's view, and the minimap shows all areas.
# Programs still see one screen. Removing the split joins the areas'
# layouts side by side. Dragging the gap between areas changes their widths
# until Tileception restarts; only `split` lasts.
#
# [outputs."DP-2"]
# split = 2                     # two equal areas, or relative widths:
#                               # split = [0.6, 0.4]
#
# [outputs."*"]
# scale = 1

# Touchscreens, by exact device name as listed in Settings > Displays.
# No mappings by default: touches use the currently active screen. Mapping a
# device activates its screen for touch input. If that screen is disconnected,
# touches from the mapped device are ignored until it returns.
#
# [touchscreens."Example touchscreen"]
# output = "eDP-1"

# Handoff: share this mouse, keyboard and clipboard with other Tileception
# machines on the network that know the same passphrase. When one appears,
# drag its card to the edge of the screen where it stands; the pointer then
# crosses there once its user has placed this machine too. Ctrl+Super+Escape
# brings input back. Locking pauses sharing until you resume it on the card.
# Pick several random words for the passphrase: guesses are slowed down, but
# a short phrase can still be guessed. Nothing listens until this is enabled
# with a passphrase. `tileception msg handoff` shows what is connected.
# Defaults: enabled = false, no passphrase, the host name, port 24850,
# discovery = true and peers = []. The following is an opt-in example.
#
# [handoff]
# enabled = true
# passphrase = "several random words go here"
# name = "laptop"               # what others see; the host name by default
# port = 24850                  # TCP, on every machine
# discovery = true              # find machines with mDNS
# peers = ["192.168.1.20"]      # or fixed addresses (host or host:port)

# Extra arguments for programs started from the launcher and the welcome
# screen, by desktop file name (without .desktop; Snap and Flatpak entries
# have their own, such as spotify_spotify and com.spotify.Client). Each is
# passed as is, never through a shell, where the program would get files or
# URLs. An option the desktop file already sets wins. Spotify is built on
# CEF and ignores ELECTRON_OZONE_PLATFORM_HINT, so it runs through Xwayland
# unless told otherwise; the lines below run its native, Snap and Flatpak
# entries on Wayland.
#
# [launch_args]
# spotify = ["--ozone-platform=wayland"]
# spotify_spotify = ["--ozone-platform=wayland"]
# "com.spotify.Client" = ["--ozone-platform=wayland"]
# firefox = ["-P", "work"]

# Doctor's agents start from a copy already installed on this computer when
# it finds one, else from the ACP Registry. To run a particular program
# instead, give its command by registry id (as `doctor use` takes it): the
# program, then its arguments, never through a shell. ~/ is your home folder.
#
# [doctor.agents]
# opencode = ["~/.opencode/bin/opencode", "acp"]
# gemini = ["/usr/local/bin/gemini", "--acp"]

# Launcher plugins are executable MCP servers over stdio. Installing a
# manifest in ~/.local/share/tileception/plugins/ enables its command.
# Only install plugins you trust, as with autostart commands.
# Build the opt-in example with:
# cargo plane build -p tileception --bin tileception-launcher-example
# [plugins.example]
# command = "/absolute/path/to/tileception-launcher-example"
# enabled = false
# [plugins.example.launcher]
# prefixes = ["echo"]
# cards = false  # hide its cards under the launcher

[keyboard]
# US international unless set: AltGr gives accents and dead keys (AltGr+'
# then e is é), while ' and " type straight away. Any xkb layout works.
# layout = "nl"
# Without an explicit layout, variant defaults to "altgr-intl"; with a layout,
# it defaults to "". No extra XKB options are set unless specified.
# variant = ""
# options = "compose:ralt"
# Unset uses XKB's default keyboard model; "" also selects that default.
# model = ""
repeat_delay = 400
repeat_rate = 30

# Key bindings: "Modifiers+Key" = "command", or a list of commands run in
# order: "Super+Escape" = ["reload", "spawn notify-send 'Reloaded'"].
# These come on top of the built-in bindings (unless default_binds = false):
# a key listed here replaces its built-in command, "none" unbinds it
# ("Super+H" = "none"), and keys not listed keep their built-in command.
#
# Modifiers: Super, Alt, Ctrl, Shift. Keys are xkb keysym names (T, Return,
# Left, bracketleft, Page_Up, F1, XF86AudioRaiseVolume, ...), or WheelUp,
# WheelDown, WheelLeft, WheelRight for the mouse wheel. A modifier on its
# own ("Super") fires when it is pressed and let go with nothing else.
#
# Commands (the same as `tileception msg <command>`):
#   terminal              open the terminal beside the focused window
#   spawn <command line>  run a shell command
#   close                 close the focused window
#   overview              show everything (Esc or a click leaves)
#   step-in [pointer]     zoom one level in, toward the focus or the pointer
#   step-out              zoom one level out
#   focus <dir>           frame the neighbouring space: left, right, up, down
#   move <dir>            move the focused window past its neighbour
#   resize <dir> <px>     move the divider next to the focused window that way
#   toggle-split          stack the focused row, or lay the column side by side
#   cycle [next|prev]     focus the next or previous window
#   maximize              frame the focused window on its own (again: back)
#   minimize              take the focused or selected windows out of the layout
#   restore [window-id]   put the last minimized window (or this one) back
#   back, forward         through the spaces you have framed
#   save <n>, go <n>      save the current view in slot 1-9, or go to it
#   next-tab, prev-tab    in the focused tile
#   float                 float the focused window above the layout, or dock it
#   fullscreen            cover the whole screen with the focused window
#   lock                  lock the screen (see lock_command)
#   power-menu            lock, log out, suspend, restart or power off
#   doctor [ask <text>]   the panel for asking about your setup
#   doctor use <agent>    pick its agent by ACP Registry id (e.g. claude-acp)
#   doctor mode <mode>    what it may do unasked: ask, config (Tileception's
#                         own files and commands) or yolo; backups either way
#   volume up|down [n]    change the output volume by n percent (or the step)
#   volume set <n>        set it; volume mute [on|off|toggle]
#   mic mute [on|off]     the microphone; mic up/down/set work too
#   brightness up|down    the screen's backlight; brightness set <n>
#   media <what>          the last-played player: play-pause, play, pause,
#                         next, previous, stop; plain "media" prints status
#   desktop               show or hide the Desktop tile
#   colour-scheme <s>     tell apps to use dark, light or default styles,
#                         until this file is next loaded
#   reload                reload this file
#   quit                  leave Tileception
#
# Always available: Ctrl+Alt+F1..F12 switch VT, Ctrl+Alt+BackSpace quits.
# In a nested window, Alt stands in for Super.
[binds]
"Super" = "launcher"
"Super+T" = "terminal"
"Super+B" = "spawn gtk-launch \"$(xdg-settings get default-web-browser)\""
"Super+E" = "spawn xdg-open \"$HOME\""
"Super+C" = "close"
"Super+L" = "lock"
"Super+X" = "power-menu"
"Super+N" = "notifications"
"Super+Return" = "answer-notification"
"Super+slash" = "doctor"
"Super+comma" = "settings"
"Super+G" = "group"
"Super+Shift+E" = "quit"
"Super+Escape" = ["reload", "spawn notify-send 'Tileception' 'Configuration reloaded'"]

"Super+O" = "overview"
"Super+equal" = "step-in"
"Super+minus" = "step-out"
"Super+KP_Add" = "step-in"
"Super+KP_Subtract" = "step-out"
"Super+I" = "step-in"
"Super+U" = "step-out"
"Super+WheelUp" = "step-in pointer"
"Super+WheelDown" = "step-out"
"Super+M" = "maximize"
"Super+H" = "minimize"
"Super+Shift+H" = "restore"
"Super+bracketleft" = "back"
"Super+bracketright" = "forward"

"Super+Left" = "focus left"
"Super+Right" = "focus right"
"Super+Up" = "focus up"
"Super+Down" = "focus down"

"Super+Shift+Left" = "move left"
"Super+Shift+Right" = "move right"
"Super+Shift+Up" = "move up"
"Super+Shift+Down" = "move down"

"Super+Alt+Left" = "resize left 40"
"Super+Alt+Right" = "resize right 40"
"Super+Alt+Up" = "resize up 40"
"Super+Alt+Down" = "resize down 40"
"Super+J" = "toggle-split"

"Alt+Tab" = "cycle next"
"Alt+Shift+Tab" = "cycle prev"
"Super+Tab" = "next-tab"
"Super+Shift+Tab" = "prev-tab"

"Super+F" = "fullscreen"
"Super+V" = "float"
"Super+Shift+F" = "float"
"Super+D" = "desktop"

# Touchpad gestures, named by finger count and the way the fingers move.
# Swipes take 3 to 5 fingers, pinches 2 to 5. Each gesture runs its binding
# once; a gesture without a binding goes to the program under the pointer,
# so two-finger pinches still zoom web pages unless Super is held.
"Swipe3Left" = "focus right"
"Swipe3Right" = "focus left"
"Swipe3Up" = "focus down"
"Swipe3Down" = "focus up"
"Pinch3In" = "step-out"
"Pinch3Out" = "step-in pointer"
"Super+Pinch2In" = "step-out"
"Super+Pinch2Out" = "step-in pointer"
"Swipe4Up" = "overview"
"Swipe4Down" = "maximize"
"Swipe4Left" = "forward"
"Swipe4Right" = "back"

# The touchscreen. A swipe in from an edge (TouchEdgeTop, Bottom, Left,
# Right), and three to five fingers that land together (TouchSwipe3Left,
# TouchPinch3In, ...), are Tileception's; other touches go to the program
# under them. In Overview two fingers pinch out to go into a tile, in to
# leave.
"TouchEdgeTop" = "overview"
"TouchEdgeBottom" = "show-minimized"
"TouchEdgeRight" = "notifications"
"TouchEdgeLeft" = "doctor"
"TouchSwipe3Left" = "focus right"
"TouchSwipe3Right" = "focus left"
"TouchSwipe3Up" = "focus down"
"TouchSwipe3Down" = "focus up"
"TouchPinch3In" = "step-out"
"TouchPinch3Out" = "step-in pointer"

# Screenshots (grim and slurp). Print captures the whole screen; Shift+Print
# lets you drag a region. Both ask whether to copy, save, or do both.
# Ctrl+Print picks a colour from the screen and copies it as hex.
"XF86AudioRaiseVolume" = "volume up"
"XF86AudioLowerVolume" = "volume down"
"XF86AudioMute" = "volume mute"
"XF86AudioMicMute" = "mic mute"
"XF86AudioPlay" = "media play-pause"
"XF86AudioPause" = "media pause"
"XF86AudioStop" = "media stop"
"XF86AudioNext" = "media next"
"XF86AudioPrev" = "media previous"
"XF86MonBrightnessUp" = "brightness up"
"XF86MonBrightnessDown" = "brightness down"
# The same for keyboards without media keys.
"Super+Ctrl+Up" = "volume up"
"Super+Ctrl+Down" = "volume down"
"Super+Ctrl+M" = "volume mute"
"Super+Ctrl+space" = "media play-pause"
"Super+Ctrl+Left" = "media previous"
"Super+Ctrl+Right" = "media next"
"Super+Ctrl+Page_Up" = "brightness up"
"Super+Ctrl+Page_Down" = "brightness down"
"Print" = "spawn tileception-screenshot"
"Shift+Print" = "spawn tileception-screenshot region --ask"
"Ctrl+Print" = "pick-colour"

"Super+1" = "go 1"
"Super+2" = "go 2"
"Super+3" = "go 3"
"Super+4" = "go 4"
"Super+5" = "go 5"
"Super+6" = "go 6"
"Super+7" = "go 7"
"Super+8" = "go 8"
"Super+9" = "go 9"
"Super+Shift+1" = "save 1"
"Super+Shift+2" = "save 2"
"Super+Shift+3" = "save 3"
"Super+Shift+4" = "save 4"
"Super+Shift+5" = "save 5"
"Super+Shift+6" = "save 6"
"Super+Shift+7" = "save 7"
"Super+Shift+8" = "save 8"
"Super+Shift+9" = "save 9"
