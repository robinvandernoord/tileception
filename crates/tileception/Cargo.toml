[package]
name = "tileception"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tileception: a zoomable, nesting tiling Wayland compositor"

[[bin]]
name = "tileception"
path = "src/main.rs"

[dependencies]
tileception-core = { path = "../tileception-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
png = "0.18"
cosmic-text = "0.19"
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smithay-drm-extras = { version = "0.1", default-features = false }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
]
