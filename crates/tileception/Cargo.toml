[package]
name = "tileception"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tileception: a zoomable, nesting tiling Wayland compositor"

[[bin]]
name = "tileception"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tileception-core = { path = "../tileception-core" }
tileception-auth = { path = "../tileception-auth" }
tileception-apps = { path = "../tileception-apps" }
tileception-notify = { path = "../tileception-notify" }
tileception-media = { path = "../tileception-media" }
tileception-acp = { path = "../tileception-acp" }
tileception-handoff = { path = "../tileception-handoff" }
getrandom = "0.3"
serde_json = "1"
html-escape = "0.2"
libc = "0.2"
zeroize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.25"
zbus = "5"
async-channel = "2"
png = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }
cosmic-text = "0.19"
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smithay-drm-extras = { version = "0.1", default-features = false }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
]
