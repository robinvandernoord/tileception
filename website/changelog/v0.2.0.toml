version = "0.2.0"
date = 2026-10-16
lede = "Doctor arrives: a panel where a coding agent answers questions about your setup. Volume, brightness and playback get built-in controls, and every part of the shell can be swapped for another program."

[[features]]
area = "doctor"
title = "Ask Doctor about your setup"
text = "Super+slash opens a panel beside the desktop where a coding agent from the ACP Registry answers in plain language. `tileception msg doctor mode` sets what it may change without asking: `ask`, `config` or `yolo`."

[[features]]
area = "media"
title = "Volume, brightness and playback controls"
text = "The media keys change volume, brightness and playback, and a small display shows the new level. `tileception msg volume up` and `mic mute` do the same from a script."

[[features]]
area = "desktop"
title = "Swap any part of the shell"
text = "The launcher, notifications, power menu, lock screen and volume controls can each stay, go, or be replaced under `[shell]`, for example by fuzzel, swaync, wlogout and swaylock."

[[features]]
area = "windows"
title = "Minimize and restore windows"
text = "Super+H minimizes the focused or selected windows, and Super+Shift+H brings back the last one."

[[features]]
area = "windows"
title = "Windows a little too big for their tile stay live"
text = "A window slightly larger than its tile, usually because of its minimum size, is drawn live and cut off instead of as a scaled-down preview."

[[features]]
area = "launcher"
title = "Paste into the launcher"
text = "Ctrl+V pastes the clipboard's text into the launcher's search field."

[[features]]
area = "portal"
title = "Apps follow light or dark"
text = "Tileception tells apps whether to use light or dark styles through the desktop portal. It is dark unless you set `colour_scheme` in `[theme]`."

[[features]]
area = "desktop"
title = "Change single shortcuts"
text = "`[binds]` now adds to the built-in shortcuts: a key you list replaces its built-in command, `\"none\"` removes it, and every other shortcut stays."

[[features]]
area = "session"
title = "A badge on the login screen"
text = "Tileception's entry in the login screen's session list has its own badge: red, blue and yellow tiles between black lines."

[[features]]
area = "packaging"
title = "Packages for Debian unstable"
text = "Tileception installs on Debian unstable (sid) too, including PikaOS 4."

[[fixes]]
area = "dbus"
text = "Programs that D-Bus starts for you get the session's environment, so they find the display."

[[fixes]]
area = "floats"
text = "A floating window grows when its content does."

[[fixes]]
area = "wayland"
text = "Screen capture tools that use dmabuf can record the screen."
