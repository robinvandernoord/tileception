version = "0.4.0"
date = 2026-10-17

[[features]]
area = "launcher"
title = "Give an app its own launch arguments"
text = "Add extra launch arguments under `[launch_args]`, using the app's desktop file name, such as `firefox = [\"-P\", \"work\"]`. Arguments are passed directly to the app without a shell. If the desktop file already sets an option, that value is used."

[[features]]
area = "packaging"
title = "The APT key comes in a package"
text = "The installer adds `tileception-archive-keyring`, so a new signing key arrives as an ordinary update."
