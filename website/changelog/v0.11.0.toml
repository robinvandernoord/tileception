version = "0.11.0"
date = 2026-11-07
lede = "A frosted theme, a colour picker and Tuya smart home controls arrive. Popups with buttons now answer to the keyboard, and the launcher finds your most used folders."

[[features]]
area = "theme"
title = "A frosted theme"
text = "Set `frost = true` under `[theme]` and the bar, launcher, notifications, power menu and cards turn translucent, blurring what is behind them. Windows stay solid."

[features.media]
kind = "image"
src = "frost-after.jpg"
alt = "The frosted launcher open over the Tileception website, whose red, yellow and blue shapes show blurred through it, with a frosted notification beside it"
caption = "The page behind the launcher shows through, blurred. The window itself stays solid."

[[features]]
area = "compositor"
title = "A colour picker"
text = "Ctrl+Print, or Pick a colour in the launcher, puts a magnifier by the pointer. Click or press Enter to copy the colour under it as hex, such as `#2acea2`."

[features.media]
kind = "image"
src = "picker-after.jpg"
alt = "The colour picker's magnifier over a red square on the Tileception website, labelled #d42a1e"
caption = "The magnifier shows the pixels under the pointer and the hex code you will copy."

[[features]]
area = "home"
title = "Tuya smart home in the notification panel"
text = "Run `tileception home import` once and set `enabled = true` under `[home]`. Super+N then shows your Tuya lights, plugs and air conditioners by room, switched over your local network."

[[features]]
area = "notifications"
title = "Answer popups from the keyboard"
text = "Super+Enter numbers the buttons on the newest popup, such as a screenshot's Copy and Save. Press a number, or choose with the arrow keys and Enter. Escape gives the keyboard back."

[features.media]
kind = "image"
src = "answer-after.jpg"
alt = "A Design review notification in the corner with its buttons numbered 1 Snooze and 2 Join, Join chosen, and an Esc Back hint"
caption = "After Super+Enter, the popup's buttons have numbers and the arrow keys move between them."

[[features]]
area = "launcher"
title = "Jump to the folders you use most"
text = "Type `z` and parts of a path, such as `z proj web`, to list the folders you visit most, as z and zoxide know them. Enter opens one in the file manager, Ctrl+Enter a terminal there."

[[features]]
area = "launcher"
title = "See and edit an app's desktop entry"
text = "Alt+Enter on an app shows the command it runs and the `.desktop` file it comes from. Edit a copy puts one in `~/.local/share/applications`, so your changes survive package updates."

[[features]]
area = "bar"
title = "The calendar opens under the clock"
text = "Clicking the clock opens the calendar right below it, with seconds, and the screen no longer dims. The unread count is now a small badge on the bell's corner."

[features.media]
kind = "compare"
before = "calendar-before.jpg"
after = "calendar-after.jpg"
alt = "The clock's calendar open over four windows, with three unread notifications"
caption = "In 0.10.0 the calendar opens in the middle of the screen. In 0.11.0 it opens under the clock and shows seconds."

[[features]]
area = "input"
title = "Held keys repeat in Tileception's own screens"
text = "Holding Backspace, an arrow or a letter repeats it in the launcher, rubber duck, Doctor, power menu, lock screen and login screen. On the last two, Ctrl+A selects what you typed."

[[features]]
area = "handoff"
title = "A colour pick follows the pointer"
text = "Move the pointer onto another screen, or to another machine through handoff, and the colour picker carries on there."

[[features]]
area = "clipboard"
title = "Keep the clipboard after an app closes"
text = "Set `persist = true` under `[clipboard]` and a copy stays pasteable after the app it came from quits. It needs `wl-clip-persist` and keeps only the latest copy, with no history."

[[features]]
area = "duck"
title = "Copy and paste in the rubber duck"
text = "The rubber duck's question field now takes Ctrl+C, Ctrl+X and Ctrl+V."

[[fixes]]
area = "setup"
text = "`tileception-setup` skips an older `tileception` that has no `tileception config`, instead of starting a nested compositor by accident."
