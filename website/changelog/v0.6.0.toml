version = "0.6.0"
date = 2026-10-18

[[features]]
area = "duck"
title = "A rubber duck that looks at your screen"
text = "Run `tileception msg duck` to let a rubber duck out onto the bottom of the screen, and again to put it away. Click it to ask a question about what is on screen."

[features.media]
kind = "image"
src = "duck-after.jpg"
alt = "A pixel-art rubber duck at the bottom of the screen, with a speech bubble holding a typed question"
caption = "Click the duck to type a question beside a thumbnail of your screen. Enter sends it, and Escape closes it."

[[fixes]]
area = "focus"
text = "You can type in a new window once Tileception has sent it its initial size and state."

[[fixes]]
area = "event-loop"
text = "Apps get their input from Tileception without delay."
