# How the changelog shows each area: the commit scope of a change.
# colour is red, yellow, blue or white (the canvas). Roughly: red for windows
# and the layout, yellow for the shell's own panels and tools, blue for what
# connects to other machines, programs and devices. A scope that is not listed
# shows its own name in white.

[desk]
colour = "red"

