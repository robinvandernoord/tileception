version = "0.19.0"
date = 2026-11-13
lede = "Super+D now clears the desk on a tap and shows it while you hold the keys. Settings asks before it drops changes you haven't applied, and a chip beside the clock shows your next event."

[[features]]
area = "desk"
issue = 87
title = "Tap Super+D to clear the desk, hold it to peek"
text = "A tap minimizes every window and remembers the layout. Tap again to bring them back. Hold Super+D and the windows fade to outlines over the dashboard until you let go."

[features.media]
kind = "compare"
before = "desk-before.jpg"
after = "desk-after.jpg"
alt = "Super+D with four windows open"
caption = "In 0.18.0, Super+D added an empty Desktop tile beside your windows. In 0.19.0, holding it shows the desk."

[[features]]
area = "settings"
issue = 43
title = "Settings asks before dropping your changes"
text = "Close Settings with unapplied changes and it offers Apply, Discard or Cancel. Edits you make to `config.toml` while Settings is open show up in it."

[features.media]
kind = "image"
src = "settings-after.jpg"
alt = "Settings open over three windows"

[[features]]
area = "calendar"
issue = 42
title = "Your next event beside the clock"
text = "Add .ics files or calendar URLs under `[calendar]` in `config.toml`. A chip beside the clock shows the event that's on, or today's next one. Click it to see what's coming up."

[[features]]
area = "desk"
issue = 87
title = "A dashboard on the empty desk"
text = "A clear desk shows your notification count beside the welcome screen. Plugins with a `[dashboard]` block can add cards, images or a surface they draw themselves."

[[features]]
area = "handoff"
issue = 84
title = "Handoff between screens of different sizes"
text = "The pointer crosses where two machines' screen edges face each other. Each keyboard keeps its own layout, and typing in a streamed window reaches that window."

[[features]]
area = "plugins"
issue = 41
title = "Add a plugin with one command"
text = "`tileception msg plugin add <command>` writes the plugin into `config.toml` and starts it. The rest of the file, comments included, stays as it was. Doctor can do this for you when you ask."

[[features]]
area = "bluetooth"
issue = 75
title = "Bluetooth icons show the kind of device"
text = "Headphones look like headphones, mice like mice. Keyboards, phones and game controllers get their own icons too."

[[features]]
area = "greeter"
issue = 86
title = "The login screen can hold still"
text = "Set `reduce_motion = true` in the greeter's settings and it fades instead of moving. A wrong password no longer shakes the field."

[[features]]
area = "smart-home"
issue = 79
title = "Humidity history next to temperature"
text = "Smart home history now keeps humidity as well as temperature, for climate devices and standalone sensors. Settings lets you choose per device."
