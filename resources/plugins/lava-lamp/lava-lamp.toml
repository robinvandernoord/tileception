# Opt-in example of a dashboard plugin that draws its own surface. Install
# pywayland, copy this manifest to
# ~/.local/share/tileception/plugins/lava-lamp.toml and set `command` to the
# absolute path of lava-lamp.py.
command = "/absolute/path/to/lava-lamp.py"

[dashboard]
surface = true
# Without the user's files or the network, which the lamp does not need.
# With it, the protocol file must be installed in /usr/share/tileception.
# confined = true
