# xdg-desktop-portal-wlr's settings in Tileception sessions, installed as
# xdg-desktop-portal-wlr/Tileception: the portal reads the file named after
# the desktop first, so other desktops keep theirs.
#
# What to share is chosen in Tileception's launcher, which lists the screens
# and, from portal 0.8 on, the windows. Without it, 0.8 can only offer
# windows through a menu program such as wofi or rofi.
[screencast]
chooser_type=dmenu
chooser_cmd=tileception pick-source
