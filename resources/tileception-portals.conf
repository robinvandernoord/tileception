# xdg-desktop-portal backends for Tileception: screen and window sharing and
# screenshots through xdg-desktop-portal-wlr (ext-image-copy-capture, or
# wlr-screencopy before 0.8), with screen sharing passed through the
# compositor's backend for restore data; light or dark, typing for
# applications (keyboard-only remote desktop) and their global shortcuts from
# the compositor; everything else GTK.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=tileception;gtk
org.freedesktop.impl.portal.ScreenCast=tileception;wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.RemoteDesktop=tileception
org.freedesktop.impl.portal.GlobalShortcuts=tileception
