# xdg-desktop-portal backends for Tileception: screen sharing and screenshots
# through xdg-desktop-portal-wlr (wlr-screencopy); light or dark, typing for
# applications (keyboard-only remote desktop) and their global shortcuts from
# the compositor; everything else GTK.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=tileception;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.RemoteDesktop=tileception
org.freedesktop.impl.portal.GlobalShortcuts=tileception
