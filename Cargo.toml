[workspace]
resolver = "2"
members = ["crates/tileception-core", "crates/tileception"]
exclude = ["crates/tileception-apps", "crates/tileception-auth", "crates/tileception-notify"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
