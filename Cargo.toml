[workspace]
resolver = "2"
members = ["crates/tileception-core", "crates/tileception"]
exclude = ["crates/tileception-apps", "crates/tileception-auth", "crates/tileception-notify"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
