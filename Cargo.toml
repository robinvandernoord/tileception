[workspace]
resolver = "2"
members = ["crates/tileception-core", "crates/tileception-handoff", "crates/tileception-media", "crates/tileception-acp", "crates/tileception-home", "crates/tileception"]
exclude = ["crates/tileception-apps", "crates/tileception-auth", "crates/tileception-notify"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[workspace.lints.clippy]
min_ident_chars = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[profile.dev]
opt-level = 1
# Above opt-level 0, rustc runs ThinLTO across each crate's codegen units by
# default. For the large compositor crate that took about 60% of an incremental
# rebuild. "off" (unlike `false`) disables it.
lto = "off"

# Dependencies keep line tables for backtraces but skip full debug info, which
# made up most of a ~700 MB debug binary that cargo-plane copies back.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# Installs from a checkout (`make install`). Release optimisation, but
# incremental and without ThinLTO, so reinstalling after an edit rebuilds
# quickly. Packaged builds use `dist` below.
[profile.dev-install]
inherits = "release"
incremental = true
lto = "off"
codegen-units = 64

# Packaged builds (`make deb`). Whole-program LTO and a single codegen unit
# trade build time for a smaller, faster binary. Limited debug info is kept
# only so scripts/build-deb.sh can split it into the -dbgsym package before
# stripping the shipped binary. Panics stay unwinding: a panicking worker
# thread must not take the whole session down with it.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "limited"
